<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel · Leonas Shoop</title>
<style>
  :root {
    --page: #fafaf9; --panel: #ffffff; --line: #e7e5e4; --fg: #1c1917;
    --muted: #57534e; --subtle: #a8a29e; --brand-50: #fffbeb;
    --brand-100: #fef3c7; --brand-600: #d97706; --brand-700: #b45309;
    --brand-800: #92400e; --wa: #25d366; --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--fg); }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }

  header {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header img.logo { width: 34px; height: 34px; border-radius: 9px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 800; }
  header h1 span { color: var(--brand-700); }
  header .sub { font-size: 11px; color: var(--subtle); }
  header .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .btn:hover { border-color: var(--brand-600); color: var(--brand-700); }
  .btn-primary { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }
  .btn-primary:hover { background: var(--brand-700); color: #fff; }
  .btn-wa { background: var(--wa); border-color: var(--wa); color: #fff; }
  .btn-danger { background: #fff; border-color: #fecaca; color: var(--danger); }
  .btn-danger:hover { background: #fef2f2; border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  main { max-width: 1150px; margin: 0 auto; padding: 20px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .toolbar input[type="search"], .toolbar select {
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--panel);
  }
  .toolbar input[type="search"] { flex: 1; min-width: 180px; }
  .count { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .card .foto { aspect-ratio: 4/5; background: var(--brand-50); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .foto img { width: 100%; height: 100%; object-fit: cover; }
  .card .foto .sin { color: var(--subtle); font-size: 30px; }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .tit { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .card .precio { font-weight: 800; color: var(--brand-700); }
  .card .precio small { color: var(--subtle); font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 999px; background: var(--brand-100); color: var(--brand-800); }
  .badge.gris { background: #f5f5f4; color: var(--muted); }
  .badge.verde { background: #d1fae5; color: #065f46; }
  .badge.rojo { background: #fee2e2; color: #991b1b; }
  .badge.azul { background: #e0f2fe; color: #075985; }
  .card .acciones { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  .card .acciones .btn { flex: 1; padding: 7px 8px; font-size: 13px; }

  .vacio { text-align: center; color: var(--muted); padding: 60px 20px; }
  .vacio b { display: block; font-size: 18px; color: var(--fg); margin-bottom: 6px; }

  dialog {
    border: none; border-radius: 16px; padding: 0; width: min(640px, calc(100vw - 28px));
    max-height: calc(100vh - 40px); box-shadow: 0 25px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(28,25,23,.5); backdrop-filter: blur(2px); }
  dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 17px; }
  .dlg-body { padding: 18px 20px; overflow: auto; display: grid; gap: 14px; }
  .dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.campo { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
  label.campo input, label.campo select, label.campo textarea {
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel); color: var(--fg); font-weight: 500;
  }
  label.campo textarea { min-height: 84px; resize: vertical; }
  label.campo input:focus, label.campo select:focus, label.campo textarea:focus { outline: 2px solid var(--brand-600); outline-offset: 1px; }
  .hint { font-size: 11.5px; color: var(--subtle); font-weight: 500; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }

  .fotos-actuales { display: flex; flex-wrap: wrap; gap: 8px; }
  .mini { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini button {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 999px; border: none;
    background: rgba(28,25,23,.75); color: #fff; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; color: var(--muted);
    font-size: 13px; cursor: pointer; background: var(--brand-50);
  }
  .drop:hover, .drop.ok { border-color: var(--brand-600); color: var(--brand-700); }

  #logPanel {
    position: fixed; right: 16px; bottom: 16px; width: min(480px, calc(100vw - 32px)); z-index: 50;
    background: #1c1917; color: #e7e5e4; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.4);
    display: none;
  }
  #logPanel.abierto { display: block; }
  #logPanel .lh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #292524; font-size: 13px; font-weight: 700; }
  #logPanel .lh .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--brand-600); animation: pulso 1s infinite alternate; }
  #logPanel.ok .lh .dot { background: var(--wa); animation: none; }
  #logPanel.err .lh .lh-msg, #logPanel.err .lh { color: #fca5a5; }
  @keyframes pulso { from { opacity: .4; } to { opacity: 1; } }
  #logPanel .logs { max-height: 240px; overflow: auto; padding: 10px 14px; font: 11.5px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  #logPanel .fin { padding: 10px 14px; border-top: 1px solid #44403c; font-size: 13px; display: none; }
  #logPanel.ok .fin, #logPanel.err .fin { display: block; }
  #logPanel .fin a { color: var(--wa); font-weight: 700; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px); z-index: 60;
    background: var(--fg); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: .25s; pointer-events: none;
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); }

  @media (max-width: 560px) {
    .fila { grid-template-columns: 1fr; }
    header h1 .sub { display: none; }
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 15px; }
    header .btn { padding: 7px 10px; font-size: 13px; white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="/img/logo.svg" alt="" onerror="this.style.display='none'" />
  <div>
    <h1>Leonas <span>Shoop</span></h1>
    <div class="sub">Panel de administración</div>
  </div>
  <div class="spacer"></div>
  <a class="btn" href="http://localhost:4321" target="_blank" rel="noopener">Ver sitio</a>
  <button class="btn btn-wa" id="btnPublicar">🚀 Publicar cambios</button>
</header>

<main>
  <div class="toolbar">
    <input type="search" id="buscar" placeholder="Buscar por título o descripción…" />
    <select id="filtroCat"><option value="">Todas las categorías</option></select>
    <span class="count" id="conteo"></span>
    <button class="btn btn-primary" id="btnNuevo">＋ Nuevo producto</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="vacio" id="vacio" hidden>
    <b>No hay productos todavía</b>
    Creá el primero con el botón “Nuevo producto”.
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="dlg-head">
      <h2 id="dlgTitulo">Nuevo producto</h2>
      <button type="button" class="btn" id="btnCerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="dlg-body">
      <div class="fila">
        <label class="campo">Título
          <input name="titulo" required maxlength="90" placeholder="Vestido rojo" />
        </label>
        <label class="campo">ID (en la URL)
          <input name="id" required maxlength="60" placeholder="vestido-rojo" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" />
          <span class="hint" id="hintId">Se genera del título · minúsculas y guiones</span>
        </label>
      </div>
      <div class="fila">
        <label class="campo">Categoría
          <select name="categoria" id="selCat"></select>
        </label>
        <label class="campo">Precio (CUP)
          <input name="precio" type="number" min="0" max="10000000" step="1" required placeholder="2500" />
        </label>
      </div>
      <div class="fila">
        <label class="campo">Condición
          <select name="condicion">
            <option value="nuevo">Nuevo</option>
            <option value="segundo-uso">Segundo uso</option>
          </select>
        </label>
        <label class="campo">Estado
          <select name="estado">
            <option value="disponible">Disponible</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
          </select>
        </label>
      </div>
      <label class="campo">Tallas
        <input name="tallas" placeholder="S, M, L  (o vacío si no aplica)" />
        <span class="hint">Separadas por coma</span>
      </label>
      <label class="campo">Descripción
        <textarea name="descripcion" maxlength="1000" placeholder="Estado real del artículo…"></textarea>
      </label>
      <label class="check"><input type="checkbox" name="destacado" /> Mostrar en la página de inicio</label>

      <div class="campo" style="display:grid;gap:7px;font-size:13px;font-weight:600;color:var(--muted)">
        Fotos
        <div class="fotos-actuales" id="fotosActuales"></div>
        <div class="drop" id="drop">📷 Tocá o arrastrá fotos aquí<br /><span class="hint">Se reducen a 1200 px y se guardan como WebP</span></div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
    </div>
  </form>
</dialog>

<div id="logPanel">
  <div class="lh"><span class="dot"></span><span class="lh-msg" id="logMsg">Publicando…</span></div>
  <div class="logs" id="logs"></div>
  <div class="fin" id="logFin"></div>
</div>

<div id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  let datos = { productos: [], categorias: [], simbolo: '$', moneda: 'CUP', imagenesExistentes: [] };
  let modo = 'crear';
  let fotosExistentes = [];
  let fotosNuevas = [];

  const slug = (s) =>
    s.toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || '';

  function toast(msg, error) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'visible' + (error ? ' error' : '');
    clearTimeout(t._h);
    t._h = setTimeout(() => (t.className = ''), 3200);
  }

  async function api(ruta, body) {
    const r = await fetch(ruta, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Error del servidor');
    return d;
  }

  async function cargar() {
    datos = await api('/api/datos');
    const selCat = $('#filtroCat');
    const selForm = $('#selCat');
    selCat.innerHTML = '<option value="">Todas las categorías</option>' + datos.categorias.map((c) => `<option value="${c.slug}">${c.nombre}</option>`).join('');
    selForm.innerHTML = datos.categorias.map((c) => `<option value="${c.slug}">${c.nombre}</option>`).join('');
    render();
  }

  function render() {
    const q = $('#buscar').value.trim().toLowerCase();
    const cat = $('#filtroCat').value;
    const lista = datos.productos.filter(
      (p) => (!cat || p.categoria === cat) && (!q || (p.titulo + ' ' + p.descripcion).toLowerCase().includes(q)),
    );
    $('#conteo').textContent = `${lista.length} de ${datos.productos.length}`;
    $('#vacio').hidden = datos.productos.length > 0;
    $('#grid').innerHTML = lista
      .map((p) => {
        const cat = datos.categorias.find((c) => c.slug === p.categoria);
        const est = p.estado === 'vendido' ? '<span class="badge rojo">Vendido</span>' : p.estado === 'reservado' ? '<span class="badge azul">Reservado</span>' : '<span class="badge verde">Disponible</span>';
        const foto = p.imagenes[0] ? `<img src="/img/${p.imagenes[0]}" alt="" loading="lazy" />` : '<span class="sin">🛍️</span>';
        return `<article class="card">
          <div class="foto">${foto}</div>
          <div class="body">
            <div class="tit">${esc(p.titulo)}</div>
            <div class="precio">${datos.simbolo}${p.precio.toLocaleString('es')} <small>${datos.moneda}</small></div>
            <div class="badges">
              <span class="badge">${cat ? esc(cat.nombre) : esc(p.categoria)}</span>
              <span class="badge gris">${p.condicion === 'nuevo' ? 'Nuevo' : '2.ª mano'}</span>
              ${est}
              ${p.destacado ? '<span class="badge">★ Destacado</span>' : ''}
              ${p.imagenes.length > 1 ? `<span class="badge gris">${p.imagenes.length} fotos</span>` : ''}
            </div>
            <div class="acciones">
              <button class="btn" data-editar="${p.id}">Editar</button>
              <button class="btn btn-danger" data-eliminar="${p.id}">Eliminar</button>
            </div>
          </div>
        </article>`;
      })
      .join('');
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function abrirDialogo(producto) {
    const f = $('#form');
    fotosNuevas = [];
    if (producto) {
      modo = 'editar';
      $('#dlgTitulo').textContent = 'Editar producto';
      f.titulo.value = producto.titulo;
      f.id.value = producto.id;
      f.id.readOnly = true;
      $('#hintId').textContent = 'No se puede cambiar (es la URL del producto)';
      f.categoria.value = producto.categoria;
      f.precio.value = producto.precio;
      f.condicion.value = producto.condicion;
      f.estado.value = producto.estado;
      f.tallas.value = producto.tallas.join(', ');
      f.descripcion.value = producto.descripcion;
      f.destacado.checked = producto.destacado;
      fotosExistentes = [...producto.imagenes];
    } else {
      modo = 'crear';
      $('#dlgTitulo').textContent = 'Nuevo producto';
      f.reset();
      f.id.readOnly = false;
      $('#hintId').textContent = 'Se genera del título · minúsculas y guiones';
      fotosExistentes = [];
    }
    pintarFotos();
    $('#dlg').showModal();
    f.titulo.focus();
  }

  function pintarFotos() {
    $('#fotosActuales').innerHTML =
      fotosExistentes
        .map((n, i) => `<div class="mini"><img src="/img/${n}" alt="" /><button type="button" data-quitar-ex="${i}" title="Quitar">✕</button></div>`)
        .join('') +
      fotosNuevas
        .map((d, i) => `<div class="mini"><img src="${d}" alt="" /><button type="button" data-quitar-nueva="${i}" title="Quitar">✕</button></div>`)
        .join('');
  }

  async function procesarArchivos(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      try {
        const bmp = await createImageBitmap(file);
        const max = 1200;
        const escala = Math.min(1, max / bmp.width);
        const w = Math.round(bmp.width * escala);
        const h = Math.round(bmp.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
        let dataUrl = canvas.toDataURL('image/webp', 0.85);
        if (!dataUrl.startsWith('data:image/webp')) dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        fotosNuevas.push(dataUrl);
      } catch {
        toast('No se pudo leer la imagen ' + file.name, true);
      }
    }
    pintarFotos();
  }

  $('#grid').addEventListener('click', (e) => {
    const ed = e.target.dataset.editar;
    const el = e.target.dataset.eliminar;
    if (ed) {
      const p = datos.productos.find((x) => x.id === ed);
      if (p) abrirDialogo(p);
    }
    if (el) {
      const p = datos.productos.find((x) => x.id === el);
      if (p && confirm(`¿Eliminar “${p.titulo}”?\n\nEl producto desaparece del sitio (las fotos se quedan en la carpeta).`)) {
        api('/api/eliminar', { id: el })
          .then(() => { toast('Producto eliminado'); return cargar(); })
          .catch((e2) => toast(e2.message, true));
      }
    }
  });

  $('#btnNuevo').onclick = () => abrirDialogo(null);
  $('#btnCerrar').onclick = () => $('#dlg').close();
  $('#btnCancelar').onclick = () => $('#dlg').close();
  $('#buscar').oninput = render;
  $('#filtroCat').onchange = render;

  $('#fotosActuales').addEventListener('click', (e) => {
    const ex = e.target.dataset.quitarEx;
    const nu = e.target.dataset.quitarNueva;
    if (ex !== undefined) fotosExistentes.splice(+ex, 1);
    if (nu !== undefined) fotosNuevas.splice(+nu, 1);
    pintarFotos();
  });

  $('#drop').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = (e) => procesarArchivos([...e.target.files]);
  $('#drop').ondragover = (e) => { e.preventDefault(); $('#drop').classList.add('ok'); };
  $('#drop').ondragleave = () => $('#drop').classList.remove('ok');
  $('#drop').ondrop = (e) => { e.preventDefault(); $('#drop').classList.remove('ok'); procesarArchivos([...e.dataTransfer.files]); };

  $('#form').addEventListener('input', () => {
    if (modo === 'crear' && !f.id.dataset.tocado) {
      const s = slug(f.titulo.value);
      if (s) f.id.value = s;
    }
  });
  $('#form').id.addEventListener('focus', () => ($('#form').id.dataset.tocado = '1'));

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const producto = {
      id: f.id.value.trim(),
      titulo: f.titulo.value.trim(),
      categoria: f.categoria.value,
      precio: parseInt(f.precio.value, 10),
      condicion: f.condicion.value,
      estado: f.estado.value,
      tallas: f.tallas.value.split(',').map((s) => s.trim()).filter(Boolean),
      descripcion: f.descripcion.value.trim(),
      destacado: f.destacado.checked,
      imagenes: fotosExistentes,
    };
    try {
      $('#btnGuardar').disabled = true;
      await api('/api/guardar', { modo, producto, nuevasImagenes: fotosNuevas.map((d) => ({ dataUrl: d })) });
      $('#dlg').close();
      toast(modo === 'crear' ? 'Producto creado' : 'Producto guardado');
      await cargar();
    } catch (err) {
      toast(err.message, true);
    } finally {
      $('#btnGuardar').disabled = false;
    }
  });

  $('#btnPublicar').onclick = async () => {
    const panel = $('#logPanel');
    const logs = $('#logs');
    panel.className = 'abierto';
    logs.textContent = '';
    $('#logMsg').textContent = 'Publicando…';
    $('#logFin').textContent = '';
    $('#btnPublicar').disabled = true;
    try {
      const r = await fetch('/api/publicar', { method: 'POST' });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let ok = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const bloque = buf.slice(0, i);
          buf = buf.slice(i + 2);
          const ev = /event: (.+)/.exec(bloque)?.[1];
          const data = JSON.parse(/data: (.+)/.exec(bloque)?.[1] || 'null');
          if (ev === 'paso') $('#logMsg').textContent = data;
          if (ev === 'linea') { logs.textContent += data + '\n'; logs.scrollTop = logs.scrollHeight; }
          if (ev === 'error') { panel.className = 'abierto err'; $('#logMsg').textContent = 'Error al publicar'; $('#logFin').textContent = data; }
          if (ev === 'fin') {
            ok = data.ok;
            if (ok) {
              panel.className = 'abierto ok';
              $('#logMsg').textContent = '¡Publicado!';
              $('#logFin').innerHTML = `Tu tienda está en línea → <a href="${data.url}" target="_blank">${data.url}</a>`;
            }
          }
        }
      }
      if (!ok && panel.className === 'abierto') { panel.className += ' err'; $('#logMsg').textContent = 'Error al publicar'; }
    } catch (e) {
      panel.className = 'abierto err';
      $('#logMsg').textContent = 'Error al publicar';
      $('#logFin').textContent = e.message;
    } finally {
      $('#btnPublicar').disabled = false;
    }
  };

  cargar()
    .then(() => {
      const q = new URLSearchParams(location.search);
      const id = q.get('editar');
      const nuevo = q.get('nuevo');
      if (id) {
        const p = datos.productos.find((x) => x.id === id);
        if (p) abrirDialogo(p);
      } else if (nuevo) abrirDialogo(null);
    })
    .catch((e) => toast('No pude cargar los datos: ' + e.message, true));
</script>
</body>
</html>
